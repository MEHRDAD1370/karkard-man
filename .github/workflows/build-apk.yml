name: Build Karkard Man APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          flutter create --platforms=android --project-name karkard_man .

      - name: Fix Android Gradle versions
        run: |
          echo "Skip gradle fix"

      - name: Fix Flutter version variables
        run: |
          sed -i 's/versionCode flutterVersionCode.toInteger()/versionCode 1/g' android/app/build.gradle
          sed -i 's/versionName flutterVersionName/versionName "1.0.0"/g' android/app/build.gradle
          
      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karkard_man_release_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
