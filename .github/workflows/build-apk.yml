name: Build Karkard Man APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q karkard_man_android_cloud_build.zip -d extracted
          cp -r extracted/karkard_man_flutter/. extracted/

      - name: Fix Gradle version
        run: |
          sed -i 's/gradle-8.4-bin.zip/gradle-8.14-bin.zip/g' extracted/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: extracted
        run: flutter pub get

      - name: Build APK
        working-directory: extracted
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karkard-man-release-apk
          path: extracted/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
