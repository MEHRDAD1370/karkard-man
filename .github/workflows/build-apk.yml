name: Build Karkard Man APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q karkard_man_android_cloud_build.zip -d extracted
          cp -r extracted/karkard_man_flutter/. extracted/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: extracted
        run: |
          flutter create --platforms=android .

      - name: Fix Android Gradle versions
        run: |
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.14-bin.zip/g' extracted/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.11.1"/g' extracted/android/settings.gradle
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "2.2.20"/g' extracted/android/settings.gradle

      - name: Fix Flutter version variables
        run: |
          sed -i 's/versionCode flutterVersionCode.toInteger()/versionCode 1/g' extracted/android/app/build.gradle
          sed -i 's/versionName flutterVersionName/versionName "1.0.0"/g' extracted/android/app/build.gradle
          
      - name: Flutter pub get
        working-directory: extracted
        run: flutter pub get

      - name: Build APK
        working-directory: extracted
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karkard-man-release-apk
          path: extracted/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
